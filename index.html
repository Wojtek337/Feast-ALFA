<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout concept: sticky top bar, content column on the left, friends rail on the right (drawer on phones).
   Tokens are RGB triples so Tailwind can apply alpha to them. Single deliberate dark look. */
:root{
  --ink-950:7 11 22; --ink-900:12 18 34; --ink-800:19 27 48; --ink-700:30 40 68; --ink-600:46 59 96;
  --txt:231 236 248; --muted:139 150 181;
  --accent:34 211 238; --accent2:139 92 246;
  --good:52 211 153; --warn:251 191 36; --bad:248 113 113;
  color-scheme:dark;
}
body{
  background-color:rgb(var(--ink-950));
  background-image:radial-gradient(900px 520px at 88% -8%,rgb(var(--accent)/.10),transparent 62%),radial-gradient(760px 440px at -6% 8%,rgb(var(--accent2)/.10),transparent 62%);
  background-attachment:fixed;
  color:rgb(var(--txt));
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgb(var(--ink-950))}
*{scrollbar-width:thin;scrollbar-color:rgb(var(--ink-600)) transparent}
*:focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px}
button{font-family:inherit}
.font-display{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.65rem;padding:.55rem 1rem;font-weight:600;font-size:.875rem;line-height:1.2;transition:filter .15s,background .15s,border-color .15s,color .15s;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:rgb(var(--accent));color:#04101a}
.btn-primary:hover:not(:disabled){filter:brightness(1.12)}
.btn-soft{background:rgb(var(--ink-700));color:rgb(var(--txt))}
.btn-soft:hover:not(:disabled){background:rgb(var(--ink-600))}
.btn-outline{border-color:rgb(var(--ink-600));color:rgb(var(--txt));background:transparent}
.btn-outline:hover:not(:disabled){border-color:rgb(var(--accent));color:rgb(var(--accent))}
.btn-danger{background:rgb(var(--bad)/.14);color:rgb(var(--bad));border-color:rgb(var(--bad)/.3)}
.btn-danger:hover:not(:disabled){background:rgb(var(--bad)/.24)}
.btn-good{background:rgb(var(--good));color:#04130d}
.btn-good:hover:not(:disabled){filter:brightness(1.1)}
.btn-sm{padding:.4rem .7rem;font-size:.8rem;border-radius:.55rem}
.input{width:100%;background:rgb(var(--ink-900));border:1px solid rgb(var(--ink-700));border-radius:.65rem;padding:.6rem .8rem;color:rgb(var(--txt));font-size:.875rem;font-family:inherit}
.input:focus{outline:none;border-color:rgb(var(--accent));box-shadow:0 0 0 3px rgb(var(--accent)/.18)}
.input::placeholder{color:rgb(var(--muted)/.7)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,rgb(var(--muted)) 50%),linear-gradient(135deg,rgb(var(--muted)) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:2rem}
.label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgb(var(--muted));margin-bottom:.35rem}
.panel{background:rgb(var(--ink-900)/.92);border:1px solid rgb(var(--ink-700));border-radius:1rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.32rem .8rem;font-size:.8rem;font-weight:500;border:1px solid rgb(var(--ink-700));color:rgb(var(--muted));background:rgb(var(--ink-900));cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{color:rgb(var(--txt));border-color:rgb(var(--ink-600))}
.chip[aria-pressed="true"]{background:rgb(var(--accent)/.14);border-color:rgb(var(--accent)/.6);color:rgb(var(--accent))}
.tag{display:inline-block;border-radius:.4rem;padding:.12rem .45rem;font-size:.7rem;font-weight:600;background:rgb(var(--ink-700));color:rgb(var(--muted))}
.gcard{background:rgb(var(--ink-900));border:1px solid rgb(var(--ink-700));border-radius:.9rem;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.gcard:hover,.gcard:focus-visible{transform:translateY(-4px);border-color:rgb(var(--accent)/.55);box-shadow:0 18px 44px -18px rgb(var(--accent)/.55)}
.gcard .quick{opacity:0;transform:translateY(6px);transition:all .2s}
.gcard:hover .quick,.gcard:focus-within .quick{opacity:1;transform:none}
@media (hover:none){.gcard .quick{opacity:1;transform:none}}
.page{animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulseDot 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}
.bar{height:6px;border-radius:999px;background:rgb(var(--ink-700));overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,rgb(var(--accent)),rgb(var(--accent2)));transition:width .4s ease}
.hscroll{overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tnum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ============================== okładki generowane ============================== */
const artCache=new Map();
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function wrapTitle(t){
  const w=t.toUpperCase().split(/\s+/);const lines=[];let cur='';
  w.forEach(x=>{if(cur&&(cur+' '+x).length>13){lines.push(cur);cur=x;}else cur=(cur+' '+x).trim();});
  if(cur)lines.push(cur);
  return lines.slice(0,3);
}
function coverArt(g){
  const key=g.id+'|'+g.title+'|'+(g.art||'');
  if(artCache.has(key))return artCache.get(key);
  const h=numHash(g.title);
  const pair=g.art||['hsl('+(h%360)+',70%,38%)','hsl('+((h+70)%360)+',75%,20%)'];
  const lines=wrapTitle(g.title);
  const fs=lines.length>2?26:lines.some(l=>l.length>11)?30:36;
  const shapes=[0,1,2,3].map(i=>{const s=numHash(g.title+i);return "<circle cx='"+(s%460)+"' cy='"+((s>>3)%215)+"' r='"+(40+(s>>5)%90)+"' fill='white' fill-opacity='"+(0.05+(i%3)*0.04)+"'/>";}).join('');
  const txt=lines.map((l,i)=>"<text x='24' y='"+(215-26-(lines.length-1-i)*(fs+4))+"' font-family='Space Grotesk,Inter,Arial,sans-serif' font-weight='800' font-size='"+fs+"' fill='white' letter-spacing='1'>"+esc(l)+"</text>").join('');
  const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 460 215'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='"+pair[0]+"'/><stop offset='1' stop-color='"+pair[1]+"'/></linearGradient><linearGradient id='b' x1='0' y1='0' x2='0' y2='1'><stop offset='.4' stop-color='black' stop-opacity='0'/><stop offset='1' stop-color='black' stop-opacity='.55'/></linearGradient></defs><rect width='460' height='215' fill='url(#a)'/>"+shapes+"<rect width='460' height='215' fill='url(#b)'/>"+txt+"</svg>";
  const uri='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';
  artCache.set(key,uri);
  return uri;
}

/* ============================== dane startowe ============================== */

    G('gta5','Grand Theft Auto V','Rockstar Games',2015,89.99,['Akcja','Przygodowe'],87,140000,271590,['#16a34a','#0f172a'],'Trzech bohaterów, jedno miasto Los Santos i napady, które wymykają się spod kontroli. Rozbudowana kampania fabularna oraz tryb online.'),
    G('rdr2','Red Dead Redemption 2','Rockstar Games',2019,249.99,['Akcja','Przygodowe'],93,45000,1174180,['#b45309','#1c1917'],'Epicka opowieść o Arthurze Morganie i gangu Van der Lindego na schyłku Dzikiego Zachodu. Ogromny, niezwykle szczegółowy świat.'),

function seedDb(){return {v:1,games:seedGames(),delisted:[],users:seedUsers(),chats:{}};}
function loadDb(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.games)&&Array.isArray(d.users)){d.delisted=d.delisted||[];d.chats=d.chats||{};return d;}}
  }catch(e){}
  return seedDb();
}
function loadSession(){
  try{return sessionStorage.getItem(SKEY)||localStorage.getItem(SKEY)||null;}catch(e){return null;}
}
function giveGame(d,userId,gameId,source){
  const u=d.users.find(x=>x.id===userId);
  if(!u||u.library.some(l=>l.gameId===gameId))return false;
  u.library.push({gameId,installed:false,installing:false,progress:0,hours:0,acquired:Date.now(),source});
  u.cart=u.cart.filter(id=>id!==gameId);
  return true;
}
function takeGame(d,userId,gameId){
  const u=d.users.find(x=>x.id===userId);if(!u)return;
  u.library=u.library.filter(l=>l.gameId!==gameId);
  if(u.playing===gameId)u.playing=null;
}
function botLine(text,game){
  if(/cześć|hej|siema|witaj|elo/i.test(text))return pick(['Hej! Co dziś gramy?','Siema! Miło Cię widzieć.','Cześć! Właśnie myślałem, żeby coś odpalić.']);
  if(/\?$/.test(text.trim()))return pick(['Dobre pytanie, daj mi chwilę.','Myślę, że tak.','Hmm, zależy. Co o tym myślisz?']);
  return pick(BOT_LINES).replace('{game}',game);
}

const Ctx=createContext(null);
const useApp=()=>useContext(Ctx);

/* ============================== małe komponenty ============================== */
function Icon({name,size=18,className='',...p}){
  const C=LR[name];
  if(!C)return <span style={{width:size,height:size,display:'inline-block'}} className={className}/>;
  return <C size={size} strokeWidth={2} className={className} {...p}/>;
}
function AvatarView({av,size=40,name='?'}){
  const a=av||{k:'icon',g:0,i:'Ghost'};
  if(a.k==='img')return <img src={a.src} alt="" width={size} height={size} className="rounded-full object-cover shrink-0" style={{width:size,height:size}}/>;
  const gr=AV_GRADS[(a.g||0)%AV_GRADS.length];
  const has=!!LR[a.i];
  return <span className="rounded-full grid place-items-center shrink-0 text-white font-bold" style={{width:size,height:size,background:'linear-gradient(135deg,'+gr[0]+','+gr[1]+')',fontSize:size*0.42}}>
    {has?<Icon name={a.i} size={Math.round(size*0.5)}/>:name.charAt(0).toUpperCase()}
  </span>;
}
function UserAvatar({u,size=40,dot=true}){
  const st=u?dispStatus(u):'offline';
  return <span className="relative inline-flex shrink-0" style={{width:size,height:size}}>
    <AvatarView av={u&&u.avatar} size={size} name={u?u.username:'?'}/>
    {dot&&<span className="absolute -bottom-0.5 -right-0.5 rounded-full border-2 border-ink-900" style={{width:Math.max(10,size*0.28),height:Math.max(10,size*0.28),background:STATUS[st].dot}}/>}
  </span>;
}
function CeoBadge({small}){
  return <span className={cx('inline-flex items-center gap-1 rounded-md font-bold tracking-wide align-middle',small?'px-1.5 py-0 text-[10px]':'px-2 py-0.5 text-[11px]')} style={{background:'linear-gradient(135deg,#fde68a,#f59e0b)',color:'#3b2300'}} title="CEO platformy Feast">
    <Icon name="Crown" size={small?10:12}/>CEO
  </span>;
}
function Name({u,className=''}){
  return <span className={cx('inline-flex items-center gap-1.5 min-w-0',className)}>
    <span className="truncate">{u.username}</span>{isCEO(u)&&<CeoBadge small/>}
  </span>;
}
function statusText(u,db){
  if(u.playing){const g=db.games.concat(db.delisted).find(x=>x.id===u.playing);return 'W grze: '+(g?g.title:'?');}
  return STATUS[u.status].label;
}
function GameCover({g,className='',style}){
  const src=g.cover||(g.steam?'https://cdn.akamai.steamstatic.com/steam/apps/'+g.steam+'/header.jpg':'');
  const [ok,setOk]=useState(false);
  useEffect(()=>{setOk(false);},[src]);
  return <div className={cx('overflow-hidden bg-ink-800',className)} style={Object.assign({backgroundImage:coverArt(g),backgroundSize:'cover',backgroundPosition:'center'},style)}>
    {src&&<img src={src} alt="" loading="lazy" onLoad={()=>setOk(true)} onError={()=>setOk(false)} className={cx('absolute inset-0 w-full h-full object-cover transition-opacity duration-300',ok?'opacity-100':'opacity-0')}/>}
  </div>;
}
function Price({g,big}){
  const p=eff(g);
  if(p===0)return <span className={cx('font-semibold text-good',big?'text-2xl':'text-sm')}>Darmowa</span>;
  return <span className="inline-flex items-center gap-2">
    {g.discount>0&&<span className="rounded bg-good px-1.5 py-0.5 text-xs font-bold text-ink-950">-{g.discount}%</span>}
    <span className="flex flex-col items-end leading-tight">
      {g.discount>0&&<span className={cx('text-muted line-through',big?'text-sm':'text-[11px]')}>{moneyPlain(g.price)}</span>}
      <span className={cx('font-semibold tnum',big?'text-2xl':'text-sm')}>{moneyPlain(p)}</span>
    </span>
  </span>;
}
function Toggle({on,onChange,label,desc,id}){
  return <label className="flex items-start justify-between gap-4 py-3 cursor-pointer">
    <span className="min-w-0"><span className="block font-medium">{label}</span>{desc&&<span className="block text-xs text-muted mt-0.5">{desc}</span>}</span>
    <button type="button" role="switch" id={id} aria-checked={on} onClick={()=>onChange(!on)} className={cx('relative h-6 w-11 shrink-0 rounded-full transition-colors',on?'bg-accent':'bg-ink-600')}>

}
function Modal({onClose,children,wide}){
  useEffect(()=>{const h=e=>{if(e.key==='Escape')onClose();};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[]);

function Empty({icon,title,text,children}){

function SectionTitle({children,right}){

}
function Toasts({items}){

    {items.map(t=><div key={t.id} className="page panel flex items-start gap-3 p-3 shadow-2xl" style={{borderColor:'rgb(var(--accent)/.4)'}}>
      <span className="mt-0.5 text-accent"><Icon name={t.kind==='msg'?'MessageCircle':t.kind==='friend'?'Users':t.kind==='error'?'AlertCircle':'Check'} size={18}/></span>
      <span className="text-sm leading-snug">{t.text}</span>
    </div>)}

function AvatarPicker({value,onChange}){
  const fileRef=useRef(null);
  const upload=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const c=document.createElement('canvas');c.width=c.height=96;
          const s=Math.min(img.width,img.height);
          c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,96,96);
          onChange({k:'img',src:c.toDataURL('image/jpeg',0.82)});
        }catch(err){}
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
    e.target.value='';
  };
  const cur=value||{k:'icon',g:0,i:'Ghost'};
  return <div className="flex flex-col gap-3">
    <div className="flex items-center gap-3">
      <AvatarView av={cur} size={56}/>
      <div className="flex flex-wrap gap-2">
        <button type="button" className="btn btn-soft btn-sm" onClick={()=>fileRef.current&&fileRef.current.click()}><Icon name="Upload" size={14}/>Wgraj zdjęcie</button>
        <input ref={fileRef} id="avatar-file" type="file" accept="image/*" className="hidden" onChange={upload}/>
      </div>
    </div>
    <div>
      <span className="label">Ikona</span>
      <div className="flex flex-wrap gap-2">
        {AV_ICONS.map(i=><button type="button" key={i} aria-label={i} onClick={()=>onChange({k:'icon',g:cur.k==='icon'?cur.g:0,i})} className={cx('grid place-items-center h-10 w-10 rounded-lg border transition',cur.k==='icon'&&cur.i===i?'border-accent bg-accent/15 text-accent':'border-ink-700 text-muted hover:text-txt')}><Icon name={i} size={18}/></button>)}
      </div>
    </div>
    <div>
      <span className="label">Kolor</span>
      <div className="flex flex-wrap gap-2">
        {AV_GRADS.map((gr,i)=><button type="button" key={i} aria-label={'Kolor '+(i+1)} onClick={()=>onChange({k:'icon',g:i,i:cur.k==='icon'?cur.i:'Ghost'})} className={cx('h-8 w-8 rounded-full border-2',cur.k==='icon'&&cur.g===i?'border-white':'border-transparent')} style={{background:'linear-gradient(135deg,'+gr[0]+','+gr[1]+')'}}/>)}
      </div>
    </div>
  </div>;
}

/* ============================== PANEL ZNAJOMYCH + CZAT ============================== */
function ChatPane({friend}){
  const A=useApp();
  const key=chatKey(A.me.id,friend.id);
  const msgs=A.db.chats[key]||[];
  const [text,setText]=useState('');
  const box=useRef(null);
  const typing=!!A.typing[friend.id];
  useEffect(()=>{if(box.current)box.current.scrollTop=box.current.scrollHeight;},[msgs.length,typing]);
  const send=e=>{e.preventDefault();const t=text.trim();if(!t)return;A.sendMessage(friend.id,t);setText('');};

    if(method==='blik'&&!/^\d{6}$/.test(f.blik))e.blik='Kod BLIK składa się z 6 cyfr.';
    if(method==='card'){
      const n=f.card.replace(/\D/g,'');
      if(n.length<13||n.length>19)e.card='Numer karty ma od 13 do 19 cyfr.';
      if(f.holder.trim().length<3)e.holder='Podaj imię i nazwisko z karty.';
      const m=/^(\d{2})\/(\d{2})$/.exec(f.exp);
      const now=new Date();
      if(!m||+m[1]<1||+m[1]>12||(2000+ +m[2])*12+ +m[1]<now.getFullYear()*12+now.getMonth()+1)e.exp='Data ważności jest nieprawidłowa lub minęła.';
      if(!/^\d{3,4}$/.test(f.cvc))e.cvc='CVC to 3 lub 4 cyfry.';
    }
    if(method==='paypal'&&!/^\S+@\S+\.\S+$/.test(f.pp))e.pp='Podaj e-mail konta PayPal.';

function RunnerGame(){
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current;const x=c.getContext('2d');
    const W=c.width,H=c.height,gy=H-50,px=90;
    let p,obs,speed,score,dead,next,best=0,raf;
    const reset=()=>{p={y:gy-30,vy:0,s:30,on:true,rot:0};obs=[];speed=5;score=0;dead=false;next=50;};
    const jump=()=>{if(dead){reset();return;}if(p.on){p.vy=-12.5;p.on=false;}};
    const key=e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}};
    reset();
    window.addEventListener('keydown',key);c.addEventListener('pointerdown',jump);
    const loop=()=>{
      if(!dead){
        p.vy+=0.7;p.y+=p.vy;
        if(p.y>=gy-p.s){p.y=gy-p.s;p.vy=0;p.on=true;p.rot=0;}else p.rot+=0.12;
        next--;
        if(next<=0){obs.push({x:W+20,w:30,h:26+Math.random()*10,block:Math.random()<0.3});next=Math.floor(46+Math.random()*50-Math.min(speed,12)*1.5);}
        obs.forEach(o=>{o.x-=speed;});
        obs=obs.filter(o=>o.x>-60);
        obs.forEach(o=>{
          const hit=px+p.s-4>o.x+4&&px+4<o.x+o.w-4&&p.y+p.s>gy-o.h+6;
          if(hit){dead=true;best=Math.max(best,Math.floor(score));}
        });
        score+=0.12;speed=5+score/60;
      }
      const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1228');g.addColorStop(1,'#1b1450');
      x.fillStyle=g;x.fillRect(0,0,W,H);
      x.fillStyle='#22d3ee';x.fillRect(0,gy,W,3);
      x.fillStyle='rgba(34,211,238,0.12)';x.fillRect(0,gy+3,W,H-gy);
      obs.forEach(o=>{
        x.fillStyle=o.block?'#8b5cf6':'#f43f5e';
        if(o.block)x.fillRect(o.x,gy-o.h,o.w,o.h);
        else{x.beginPath();x.moveTo(o.x,gy);x.lineTo(o.x+o.w/2,gy-o.h);x.lineTo(o.x+o.w,gy);x.closePath();x.fill();}
      });
      x.save();x.translate(px+p.s/2,p.y+p.s/2);x.rotate(p.rot);
      x.fillStyle='#facc15';x.fillRect(-p.s/2,-p.s/2,p.s,p.s);
      x.fillStyle='#0b1228';x.fillRect(-p.s/2+6,-p.s/2+7,6,6);x.fillRect(p.s/2-12,-p.s/2+7,6,6);
      x.restore();
      x.fillStyle='#e7ecf8';x.font='bold 16px Inter,sans-serif';x.fillText('Wynik: '+Math.floor(score)+'   Rekord: '+Math.max(best,Math.floor(score)),16,28);
      if(dead){
        x.fillStyle='rgba(7,11,22,0.7)';x.fillRect(0,0,W,H);
        x.fillStyle='#fff';x.font='bold 28px Inter,sans-serif';x.textAlign='center';
        x.fillText('Koniec gry',W/2,H/2-6);
        x.font='15px Inter,sans-serif';x.fillText('Kliknij lub naciśnij spację, aby zagrać ponownie',W/2,H/2+24);x.textAlign='left';
      }
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',key);c.removeEventListener('pointerdown',jump);};
  },[]);
  return <div><canvas ref={ref} width={640} height={280} className="w-full rounded-xl border border-ink-700 touch-none cursor-pointer" aria-label="Geometry Dash: skacz nad przeszkodami"/><p className="text-xs text-muted mt-2">Skacz klikaniem, dotknięciem lub spacją. Omijaj kolce i bloki.</p></div>;
}
function AimGame(){
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current;const x=c.getContext('2d');
    const W=c.width,H=c.height;
    let targets,hits,shots,left,last,spawn,raf,over;
    const reset=()=>{targets=[];hits=0;shots=0;left=30;last=performance.now();spawn=0;over=false;};
    reset();
    const click=e=>{
      if(over){reset();return;}
      const r=c.getBoundingClientRect();const mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;
      shots++;
      for(let i=targets.length-1;i>=0;i--){const t=targets[i];if(Math.hypot(mx-t.x,my-t.y)<=t.r){targets.splice(i,1);hits++;break;}}
    };
    c.addEventListener('pointerdown',click);
    const loop=now=>{
      const dt=(now-last)/1000;last=now;
      if(!over){
        left-=dt;spawn-=dt;
        if(spawn<=0){targets.push({x:40+Math.random()*(W-80),y:60+Math.random()*(H-100),r:24,life:1.3});spawn=0.55;}
        targets.forEach(t=>{t.life-=dt;});targets=targets.filter(t=>t.life>0);
        if(left<=0){left=0;over=true;}
      }
      x.fillStyle='#0b1228';x.fillRect(0,0,W,H);
      x.strokeStyle='rgba(139,150,181,0.12)';x.lineWidth=1;
      for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}
      for(let j=0;j<H;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke();}
      targets.forEach(t=>{
        const k=Math.max(0.35,t.life/1.3);
        x.fillStyle='#f43f5e';x.beginPath();x.arc(t.x,t.y,t.r*k+4,0,7);x.fill();
        x.fillStyle='#fff';x.beginPath();x.arc(t.x,t.y,t.r*k*0.6,0,7);x.fill();
        x.fillStyle='#f43f5e';x.beginPath();x.arc(t.x,t.y,t.r*k*0.25,0,7);x.fill();
      });
      x.fillStyle='#e7ecf8';x.font='bold 16px Inter,sans-serif';
      x.fillText('Czas: '+Math.ceil(left)+' s   Trafienia: '+hits+'   Celność: '+(shots?Math.round(hits/shots*100):0)+'%',16,28);
      if(over){
        x.fillStyle='rgba(7,11,22,0.75)';x.fillRect(0,0,W,H);
        x.fillStyle='#fff';x.textAlign='center';x.font='bold 28px Inter,sans-serif';
        x.fillText('Trafień: '+hits+' z '+shots+' strzałów',W/2,H/2-6);
        x.font='15px Inter,sans-serif';x.fillText('Kliknij, aby zacząć od nowa',W/2,H/2+24);x.textAlign='left';
      }
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf);c.removeEventListener('pointerdown',click);};
  },[]);
  return <div><canvas ref={ref} width={640} height={360} className="w-full rounded-xl border border-ink-700 touch-none cursor-crosshair" aria-label="Trening celności: klikaj w cele"/><p className="text-xs text-muted mt-2">Przez 30 sekund klikaj w pojawiające się cele. Im szybciej, tym lepiej.</p></div>;
}
function GameLauncher({gid}){
  const A=useApp();
  const g=A.db.games.concat(A.db.delisted).find(x=>x.id===gid);
  const [copied,setCopied]=useState(false);
  if(!g)return null;
  const link=g.steam?'steam://rungameid/'+g.steam:'';
  const copy=()=>{try{navigator.clipboard.writeText(link).then(()=>setCopied(true),()=>setCopied(false));}catch(e){}};
  const kind=g.id==='geometrydash'?'runner':(g.id==='cs2'||g.id==='apex')?'aim':'none';
  const entry=A.me.library.find(l=>l.gameId===gid);
  return <Modal onClose={A.stopPlaying} wide>

        {link?<div className="flex gap-2"><input id="steam-link" readOnly className="input tnum" value={link} onFocus={e=>e.target.select()}/><button type="button" className="btn btn-soft" onClick={copy}><Icon name={copied?'Check':'Copy'} size={14}/>{copied?'Skopiowano':'Kopiuj'}</button></div>

    </div>
  </Modal>;
}

        <button type="button" className="btn btn-primary" disabled={!gid} onClick={()=>{A.adminGrant(u.id,gid);setGid('');}}><Icon name="Gift" size={15}/>Nadaj</button>
      </div>
      <div><span className="label">Biblioteka użytkownika ({u.library.length})</span>
        {u.library.length===0?<p className="text-sm text-muted">Brak gier.</p>:<div className="flex flex-col gap-1.5">
          {u.library.map(l=>{const g=db.games.concat(db.delisted).find(x=>x.id===l.gameId);return <div key={l.gameId} className="flex items-center gap-3 rounded-lg bg-ink-800 p-2">
            <div className="relative w-14 aspect-[460/215] rounded shrink-0">{g&&<GameCover g={g} className="absolute inset-0 rounded"/>}</div>
            <span className="flex-1 min-w-0 text-sm truncate">{g?g.title:l.gameId}</span>
            <span className="text-xs text-muted hidden sm:block">{l.source==='gift'?'prezent':l.source==='free'?'darmowa':'zakup'}</span>
            <button type="button" className="btn btn-danger btn-sm" onClick={()=>A.adminRevoke(u.id,l.gameId)}><Icon name="Undo2" size={13}/>Odbierz</button>
          </div>;})}
        </div>}
      </div>
    </div>}
  </div>;
}

          <p className="text-xs text-muted mt-2">Gracze, którzy już mają wycofaną grę, zachowują ją w bibliotece.</p></div>}

/* ============================== GŁÓWNA APLIKACJA ============================== */
function App(){
  const [db,setDb]=useState(loadDb);
  const [sid,setSid]=useState(loadSession);
  const [view,setView]=useState({name:'store'});
  const [q,setQ]=useState('');
  const [toasts,setToasts]=useState([]);
  const [rail,setRail]=useState(false);
  const [chatWith,setChatWith]=useState(null);
  const [profileId,setProfileId]=useState(null);
  const [achGame,setAchGame]=useState(null);
  const [typing,setTyping]=useState({});
  const [launch,setLaunch]=useState(null);
  const dbRef=useRef(db);dbRef.current=db;
  const me=db.users.find(u=>u.id===sid&&!u.bot)||null;
  const meRef=useRef(me);meRef.current=me;
  const chatRef=useRef(chatWith);chatRef.current=chatWith;
  const installedRef=useRef({});

  const toast=useCallback((text,kind)=>{
    const id=uid();
    setToasts(t=>t.concat([{id,text,kind:kind||'ok'}]).slice(-4));
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3800);
  },[]);
  const mutate=useCallback(fn=>setDb(prev=>{const n=structuredClone(prev);fn(n);return n;}),[]);
  const updateMe=fn=>{const id=meRef.current&&meRef.current.id;if(!id)return;mutate(d=>{fn(d.users.find(u=>u.id===id),d);});};
  const go=(name,extra)=>{setView(Object.assign({name},extra||{}));setRail(false);window.scrollTo({top:0});};

  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}},[db]);
  useEffect(()=>{
    const h=e=>{if(e.key===KEY&&e.newValue){try{const d=JSON.parse(e.newValue);if(d&&d.games&&d.users)setDb(d);}catch(err){}}};
    window.addEventListener('storage',h);return()=>window.removeEventListener('storage',h);
  },[]);
  useEffect(()=>{
    const t=ACCENTS[(me&&me.accent)||'cyan']||ACCENTS.cyan;
    const r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--accent2',t.b);
  },[me&&me.accent]);

  /* instalacja: symulowany pasek postępu */
  useEffect(()=>{
    if(!me)return;
    const t=setInterval(()=>{
      const u=meRef.current;if(!u||!u.library.some(l=>l.installing))return;
      mutate(d=>{const x=d.users.find(z=>z.id===u.id);if(!x)return;x.library.forEach(l=>{if(l.installing){l.progress=Math.min(100,l.progress+3+Math.random()*9);if(l.progress>=100){l.installing=false;l.installed=true;l.progress=100;}}});});
    },500);
    return()=>clearInterval(t);
  },[me&&me.id]);
  useEffect(()=>{
    if(!me){installedRef.current={};return;}
    const prev=installedRef.current;const next={};
    me.library.forEach(l=>{next[l.gameId]=l.installed;if(prev[l.gameId]===false&&l.installed){const g=db.games.concat(db.delisted).find(x=>x.id===l.gameId);if(g)toast('Zainstalowano: '+g.title);}});
    installedRef.current=next;
  },[me&&me.library]);
  /* licznik godzin w trakcie gry */
  useEffect(()=>{
    if(!me||!me.playing)return;
    const gid=me.playing,uidv=me.id;
    const t=setInterval(()=>{mutate(d=>{const x=d.users.find(z=>z.id===uidv);const l=x&&x.library.find(z=>z.gameId===gid);if(l)l.hours=Math.round((l.hours+0.1)*10)/10;});},3000);
    return()=>clearInterval(t);
  },[me&&me.id,me&&me.playing]);
  useEffect(()=>{if(me&&me.playing&&!me.library.some(l=>l.gameId===me.playing&&l.installed))updateMe(u=>{u.playing=null;});},[me&&me.playing,me&&me.library]);
  /* znajomi zmieniają statusy */
  useEffect(()=>{
    if(!me)return;
    const t=setInterval(()=>{
      const d=dbRef.current;const m=meRef.current;if(!m)return;
      const bots=d.users.filter(u=>u.bot);if(!bots.length)return;
      const b=pick(bots);const ns=pick(['online','away','offline'].filter(s=>s!==b.status));
      mutate(x=>{const y=x.users.find(z=>z.id===b.id);y.status=ns;y.playing=null;});
      if(ns==='online'&&m.friends.includes(b.id)&&m.notif.friends)toast(b.username+' jest teraz online','friend');
    },40000);
    return()=>clearInterval(t);
  },[me&&me.id]);
  /* promocje po zalogowaniu */
  useEffect(()=>{
    if(!me||!me.notif.promos)return;
    const g=dbRef.current.games.filter(x=>x.discount>0&&eff(x)>0).sort((a,b)=>b.discount-a.discount)[0];
    if(g)setTimeout(()=>toast('Promocja: '+g.title+' -'+g.discount+'% (teraz '+moneyPlain(eff(g))+')'),900);
  },[me&&me.id]);
  /* oznaczanie wiadomości jako przeczytane */
  const openCount=me&&chatWith?(db.chats[chatKey(me.id,chatWith)]||[]).length:0;
  useEffect(()=>{
    if(!me||!chatWith)return;
    const k=chatKey(me.id,chatWith);const list=dbRef.current.chats[k]||[];
    const last=list.length?list[list.length-1].ts:0;
    if(last>(me.read[k]||0))updateMe(u=>{u.read[k]=Date.now();});
  },[chatWith,openCount]);

  /* sesja */
  const login=id=>{
    setSid(id);setChatWith(null);setRail(false);setQ('');setView({name:'store'});
    try{sessionStorage.setItem(SKEY,id);localStorage.setItem(SKEY,id);}catch(e){}
    window.scrollTo({top:0});
  };
  const logout=()=>{
    setSid(null);setChatWith(null);setRail(false);
    try{sessionStorage.removeItem(SKEY);localStorage.removeItem(SKEY);}catch(e){}
  };
  const tryLogin=(email,pass)=>{
    const u=dbRef.current.users.find(x=>!x.bot&&x.email.toLowerCase()===email.trim().toLowerCase());
    if(!u||u.pass!==hashPw(pass))return 'Nieprawidłowy e-mail lub hasło.';
    login(u.id);return null;
  };
  const tryRegister=({email,pass,nick,avatar})=>{
    const d=dbRef.current;const e=email.trim();const n=nick.trim();
    if(!/^\S+@\S+\.\S+$/.test(e))return 'Podaj poprawny adres e-mail.';
    if(n.length<3||n.length>20)return 'Nazwa użytkownika musi mieć od 3 do 20 znaków.';
    if(pass.length<6)return 'Hasło musi mieć co najmniej 6 znaków.';
    if(d.users.some(u=>!u.bot&&u.email.toLowerCase()===e.toLowerCase()))return 'Konto z tym adresem e-mail już istnieje.';
    if(d.users.some(u=>u.username.toLowerCase()===n.toLowerCase()))return 'Ta nazwa użytkownika jest zajęta.';
    const u=baseUser({email:e,username:n,pass:hashPw(pass),avatar,friends:['b_kasia','b_neon','b_ola']});
    mutate(x=>{
      x.users.push(u);
      u.friends.forEach(fid=>{const b=x.users.find(z=>z.id===fid);if(b&&!b.friends.includes(u.id))b.friends.push(u.id);});
      x.chats[chatKey(u.id,'b_kasia')]=[{id:uid(),from:'b_kasia',text:'Cześć '+n+'! Witaj w Feast. Daj znać, jak będziesz szukać ekipy do gry.',ts:Date.now()}];
    });
    login(u.id);return null;
  };
  const tryGoogle=email=>{
    const e=email.trim();
    if(!/^\S+@\S+\.\S+$/.test(e))return 'Podaj poprawny adres e-mail Google.';
    const d=dbRef.current;
    const ex=d.users.find(u=>!u.bot&&u.email.toLowerCase()===e.toLowerCase());
    if(ex){
      if(!ex.google)return 'To konto ma hasło w Feast. Zaloguj się hasłem.';
      login(ex.id);return null;
    }
    let nick=e.split('@')[0].replace(/[^A-Za-z0-9_]/g,'').slice(0,16)||'Gracz';
    while(d.users.some(u=>u.username.toLowerCase()===nick.toLowerCase()))nick=nick.slice(0,13)+Math.floor(100+Math.random()*900);
    const u=baseUser({email:e,username:nick,pass:'',google:true,avatar:{k:'icon',g:Math.floor(Math.random()*AV_GRADS.length),i:pick(AV_ICONS)},friends:['b_kasia','b_neon','b_ola']});
    mutate(x=>{
      x.users.push(u);
      u.friends.forEach(fid=>{const b=x.users.find(z=>z.id===fid);if(b&&!b.friends.includes(u.id))b.friends.push(u.id);});
      x.chats[chatKey(u.id,'b_kasia')]=[{id:uid(),from:'b_kasia',text:'Cześć '+nick+'! Witaj w Feast.',ts:Date.now()}];
    });
    login(u.id);return null;
  };
  const quick=which=>{
    const d=dbRef.current;
    if(which==='demo'){const u=d.users.find(x=>x.email==='demo@feast.app');if(u){login(u.id);return;}}
    let u=d.users.find(x=>!x.bot&&x.email.toLowerCase()===CEO_EMAIL);
    if(!u){
      u=baseUser({email:CEO_EMAIL,username:d.users.some(x=>x.username==='WojtekD')?'WojtekD_CEO':'WojtekD',pass:hashPw('feast123'),avatar:{k:'icon',g:3,i:'Crown'},bio:'CEO platformy Feast.',friends:['b_kasia','b_neon','b_raven']});
      mutate(x=>{x.users.push(u);u.friends.forEach(fid=>{const b=x.users.find(z=>z.id===fid);if(b)b.friends.push(u.id);});});
    }
    login(u.id);
  };
  const switchTo=id=>login(id);

  /* sklep */
  const owns=gid=>!!me&&me.library.some(l=>l.gameId===gid);
  const addToCart=g=>{updateMe(u=>{if(!u.cart.includes(g.id))u.cart.push(g.id);});toast('Dodano do koszyka: '+g.title);};
  const removeFromCart=gid=>updateMe(u=>{u.cart=u.cart.filter(x=>x!==gid);});
  const claimFree=g=>{mutate(d=>{giveGame(d,meRef.current.id,g.id,'free');});toast('Dodano do biblioteki: '+g.title);};
  const buyNow=g=>{updateMe(u=>{if(!u.cart.includes(g.id))u.cart.push(g.id);});go('checkout');};
  const quickAct=g=>{
    if(owns(g.id))go('library');
    else if(isFree(g))claimFree(g);
    else if(me.cart.includes(g.id))go('cart');
    else addToCart(g);
  };
  /* biblioteka */
  const install=gid=>updateMe(u=>{const l=u.library.find(x=>x.gameId===gid);if(l&&!l.installed){l.installing=true;l.progress=0;}});
  const cancelInstall=gid=>updateMe(u=>{const l=u.library.find(x=>x.gameId===gid);if(l){l.installing=false;l.progress=0;}});
  const uninstall=gid=>updateMe(u=>{const l=u.library.find(x=>x.gameId===gid);if(l){l.installed=false;l.installing=false;l.progress=0;}if(u.playing===gid)u.playing=null;});
  const play=gid=>{
    if(!meRef.current){toast('Zaloguj się, aby grać','error');return;}
    const g=db.games.concat(db.delisted).find(x=>x.id===gid);
    updateMe(u=>{u.playing=gid;});
    const nat=window.feastNative;
    if(nat&&g&&g.steam){
      nat.launchSteam(g.steam).then(r=>{
        if(!r||!r.ok){updateMe(u=>{u.playing=null;});toast('Nie udało się uruchomić gry przez Steam. Czy Steam jest zainstalowany?','error');}
      }).catch(()=>{updateMe(u=>{u.playing=null;});toast('Nie udało się uruchomić gry przez Steam.','error');});
      toast('Uruchamianie przez Steam: '+g.title);
      return;
    }
    setLaunch(gid);
    if(g)toast('Uruchomiono: '+g.title);
  };
  const stopPlaying=()=>{updateMe(u=>{u.playing=null;});setLaunch(null);};
  /* znajomi */
  const addFriend=fid=>{
    const t=dbRef.current.users.find(u=>u.id===fid);
    mutate(d=>{const a=d.users.find(u=>u.id===meRef.current.id);const b=d.users.find(u=>u.id===fid);if(a&&b){if(!a.friends.includes(fid))a.friends.push(fid);if(!b.friends.includes(a.id))b.friends.push(a.id);}});
    if(t)toast('Dodano do znajomych: '+t.username,'friend');
  };
  const removeFriend=fid=>{
    mutate(d=>{const a=d.users.find(u=>u.id===meRef.current.id);const b=d.users.find(u=>u.id===fid);if(a)a.friends=a.friends.filter(x=>x!==fid);if(b)b.friends=b.friends.filter(x=>x!==a.id);});
    if(chatRef.current===fid)setChatWith(null);
  };
  const unread=fid=>{if(!me)return 0;const k=chatKey(me.id,fid);return (db.chats[k]||[]).filter(m=>m.from!==me.id&&m.ts>(me.read[k]||0)).length;};
  const sendMessage=(toId,text)=>{
    const from=meRef.current.id;const k=chatKey(from,toId);
    mutate(d=>{(d.chats[k]=d.chats[k]||[]).push({id:uid(),from,text,ts:Date.now()});});
    const bot=dbRef.current.users.find(u=>u.id===toId);
    if(bot&&bot.bot&&bot.status!=='offline'){
      setTyping(t=>Object.assign({},t,{[toId]:true}));
      setTimeout(()=>{
        const d=dbRef.current;const b=d.users.find(u=>u.id===toId);
        const gid=(b&&b.playing)||(b&&b.library[0]&&b.library[0].gameId);
        const gm=d.games.concat(d.delisted).find(x=>x.id===gid);
        const line=botLine(text,gm?gm.title:'coś nowego');
        mutate(x=>{(x.chats[k]=x.chats[k]||[]).push({id:uid(),from:toId,text:line,ts:Date.now()});});
        setTyping(t=>Object.assign({},t,{[toId]:false}));
        const m=meRef.current;
        if(m&&m.id===from&&m.notif.messages&&chatRef.current!==toId)toast(b.username+': '+line,'msg');
      },1100+Math.random()*1800);
    }
  };
  /* panel CEO */
  const guard=()=>isCEO(meRef.current);
  const adminAddGame=o=>{
    if(!guard())return;
    mutate(d=>{d.games.unshift({id:'g_'+uid(),title:o.title,dev:o.dev,year:new Date().getFullYear(),price:o.price,discount:0,genres:[o.cat],rating:null,players:1000,steam:null,art:null,desc:o.desc,cover:o.cover,addedAt:Date.now()});});
    toast('Dodano grę do sklepu: '+o.title+(o.price===0?' (darmowa)':''));
  };
  const adminSaveGame=(id,price,disc)=>{
    if(!guard())return;
    mutate(d=>{const g=d.games.find(x=>x.id===id);if(g){g.price=Math.round(price*100)/100;g.discount=g.price===0?0:Math.round(disc);}});
    toast('Zapisano ceny');
  };
  const adminDeleteGame=id=>{
    if(!guard())return;
    mutate(d=>{const g=d.games.find(x=>x.id===id);if(!g)return;d.games=d.games.filter(x=>x.id!==id);d.delisted.push(g);d.users.forEach(u=>{u.cart=u.cart.filter(x=>x!==id);});});
    toast('Usunięto ze sklepu');
  };
  const adminRestoreGame=id=>{
    if(!guard())return;
    mutate(d=>{const g=d.delisted.find(x=>x.id===id);if(!g)return;d.delisted=d.delisted.filter(x=>x.id!==id);d.games.push(g);});
    toast('Przywrócono grę w sklepie');
  };
  const adminGrant=(userId,gameId)=>{
    if(!guard())return;
    mutate(d=>{giveGame(d,userId,gameId,'gift');});
    const u=dbRef.current.users.find(x=>x.id===userId);const g=dbRef.current.games.find(x=>x.id===gameId);
    toast('Nadano '+(g?g.title:'grę')+' użytkownikowi '+(u?u.username:''));
  };
  const adminRevoke=(userId,gameId)=>{
    if(!guard())return;
    mutate(d=>{takeGame(d,userId,gameId);});
    toast('Odebrano grę z biblioteki');
  };
  const openProfile=id=>setProfileId(id);

  const ctx={db,me,view,q,setQ,go,mutate,updateMe,toast,rail,setRail,chatWith,setChatWith,typing,unread,
    tryLogin,tryRegister,tryGoogle,switchTo,logout,owns,addToCart,removeFromCart,claimFree,buyNow,quick:quickAct,
    install,cancelInstall,uninstall,play,stopPlaying,addFriend,removeFriend,sendMessage,openProfile,setAchGame,
    adminAddGame,adminSaveGame,adminDeleteGame,adminRestoreGame,adminGrant,adminRevoke};

  if(!me){
    const authCtx=Object.assign({},ctx,{quick:quick});
    return <Ctx.Provider value={authCtx}><AuthScreen/><Toasts items={toasts}/></Ctx.Provider>;
  }
  let content=null;
  const vn=view.name==='admin'&&!isCEO(me)?'store':view.name;
  if(vn==='store')content=<StoreView/>;
  else if(vn==='game')content=<GameView id={view.id}/>;
  else if(vn==='cart')content=<CartView/>;
  else if(vn==='checkout')content=<CheckoutView/>;
  else if(vn==='library')content=<LibraryView/>;
  else if(vn==='community')content=<CommunityView/>;
  else if(vn==='settings')content=<SettingsView/>;
  else if(vn==='admin')content=<AdminView/>;
  return <Ctx.Provider value={ctx}>
    <TopBar/>
    <div className="max-w-[1500px] mx-auto flex gap-5 py-5 items-start">
      <main className="flex-1 min-w-0">{content}</main>
      <aside className="hidden lg:block w-[300px] shrink-0 sticky" style={{top:'calc(88px + env(safe-area-inset-top,0px))',height:'calc(100vh - 112px)'}} aria-label="Znajomi"><FriendsRail/></aside>
    </div>
    {rail&&<div className="lg:hidden fixed inset-0 z-50">
      <div className="absolute inset-0 bg-black/70" onClick={()=>{setChatWith(null);setRail(false);}}/>
      <div className="absolute right-0 top-0 bottom-0 w-[min(340px,92vw)] page" style={{paddingTop:'env(safe-area-inset-top,0px)',paddingBottom:'env(safe-area-inset-bottom,0px)',background:'rgb(var(--ink-950))'}}><FriendsRail drawer/></div>
    </div>}
    {profileId&&<ProfileModal id={profileId}/>}
    {achGame&&<AchievementsModal gameId={achGame}/>}
    {launch&&me.playing===launch&&<GameLauncher gid={launch}/>}
    <Toasts items={toasts}/>
  </Ctx.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
